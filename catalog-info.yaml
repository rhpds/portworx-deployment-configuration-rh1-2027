metadata:
  name: portworx-deployment-configuration-rh1-2027
  title: portworx-deployment-configuration-rh1-2027
  description: " Migration of the existing Portworx Enterprise lab (pxe-rhdp-lab)
    into the Publishing House workflow for Red Hat One 2027. This lab covers
    Portworx Enterprise deployment and configuration on   OpenShift as a
    vSAN/datastore replacement for OCP Virtualization environments. Scope: Kube
    Datastore overview (KDS vs PXE), installing Portworx Enterprise via the OCP
    Operator catalog,   managing storage and dynamic storage pools, deploying VM
    workloads on RWX block storage, simulating node failover and storage
    recovery, manual pool relocation, and auto-rebalancing
    across   heterogeneous backends. Target audience: Red Hat field (SEs,
    architects, sellers). Duration: approximately 2 hours."
