---
# Post-solve validation, not fresh-environment readiness or a student walkthrough.
# Run healthcheck.yml separately before solving. See README.md.
- name: Validate LB8002 module outcomes
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: "{{ lookup('env', 'K8S_AUTH_KUBECONFIG') | default(lookup('env', 'KUBECONFIG'), true) }}"
  environment:
    KUBECONFIG: "{{ lookup('env', 'K8S_AUTH_KUBECONFIG') | default(lookup('env', 'KUBECONFIG'), true) }}"
  vars:
    e2e_namespace: vmtest
    e2e_vm: centos-stream9-example
    e2e_autopilot_vm: centos-stream9-autopilot
    e2e_ssh_key: "{{ lookup('env', 'HOME') }}/.ssh/id_rsa"
    e2e_retries: 90
    e2e_delay: 10
    e2e_autopilot_settle_seconds: 60
    e2e_module06_enabled: true
  tasks:
    - name: Validate module 01 - Installation and storage integration
      ansible.builtin.import_tasks: tasks/module-01.yml
      tags: [module01]

    - name: Validate module 02 - Running VM and RWX block storage
      ansible.builtin.import_tasks: tasks/module-02.yml
      tags: [module02]

    - name: Validate module 03 - Migration and data persistence
      ansible.builtin.import_tasks: tasks/module-03.yml
      tags: [module03]

    - name: Validate module 04 - Snapshot and restore outcomes
      ansible.builtin.import_tasks: tasks/module-04.yml
      tags: [module04]

    - name: Validate module 05 - Autopilot volume expansion
      ansible.builtin.import_tasks: tasks/module-05.yml
      tags: [module05]

    - name: Validate module 06 - Dynamic I/O control smoke test
      ansible.builtin.import_tasks: tasks/module-06.yml
      when: e2e_module06_enabled | bool
      tags: [module06]
