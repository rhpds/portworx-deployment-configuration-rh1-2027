---
# Full student workflow. Keep this filename: the Showroom runner invokes e2e.yml.
- name: Initialize the full student E2E workflow on the disposable cluster
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars.yml
  tags: [always]
  tasks:
    - name: Create the result directory for this invocation
      ansible.builtin.file:
        path: "{{ e2e_artifacts_dir }}"
        state: directory
        mode: '0700'

    - name: Find previous result files so a failed rerun cannot show stale passes
      ansible.builtin.find:
        paths: "{{ e2e_artifacts_dir }}"
        patterns: ['module-*.json', 'fio-*.json']
      register: e2e_previous_results

    - name: Clear only previous E2E result JSON
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ e2e_previous_results.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

- name: Complete module 01 - Install Portworx and Virtualization
  ansible.builtin.import_playbook: modules/module-01.yml

- name: Complete module 02 - Create virtual machines
  ansible.builtin.import_playbook: modules/module-02.yml

- name: Complete module 03 - Live migration and high availability
  ansible.builtin.import_playbook: modules/module-03.yml

- name: Complete module 04 - Snapshot and restore
  ansible.builtin.import_playbook: modules/module-04.yml

- name: Complete module 05 - Autopilot capacity expansion
  ansible.builtin.import_playbook: modules/module-05.yml

- name: Complete module 06 - Dynamic application I/O
  ansible.builtin.import_playbook: modules/module-06.yml
