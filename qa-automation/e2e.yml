---
# E2E test for LB8002 — Portworx Enterprise Deployment and Configuration
#
# Scope: verifies the lab environment is in the correct start state for a
# student to begin. Full Portworx installation automation is out of scope
# because the install requires student interaction with Portworx Central
# and the OCP console (module 1 of the lab).
#
- name: E2E — Portworx Lab Environment Readiness
  hosts: localhost
  gather_facts: false
  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: "{{ lookup('env', 'K8S_AUTH_KUBECONFIG') | default(lookup('env', 'KUBECONFIG'), true) }}"

  tasks:

    - name: Run health check
      ansible.builtin.include_tasks: healthcheck.yml

    - name: Check bastion SSH connectivity
      ansible.builtin.wait_for:
        host: "{{ lookup('env', 'bastion_public_hostname') }}"
        port: 22
        timeout: 10
      when: lookup('env', 'bastion_public_hostname') != ''
      ignore_errors: true

    - name: Verify EBS Cloud Drive prerequisite -- worker nodes have no Portworx devices yet
      kubernetes.core.k8s_info:
        kind: Namespace
        name: portworx
      register: portworx_ns_e2e
      failed_when: false

    - name: Verify Thanos Querier route is accessible (required for Portworx Autopilot install)
      kubernetes.core.k8s_info:
        api_version: route.openshift.io/v1
        kind: Route
        namespace: openshift-monitoring
        name: thanos-querier
      register: thanos_route
      failed_when: thanos_route.resources | length == 0

    - name: Verify user workload monitoring ConfigMap can be created (Portworx prerequisite check)
      kubernetes.core.k8s_info:
        kind: ConfigMap
        namespace: openshift-monitoring
        name: cluster-monitoring-config
      register: monitoring_cm
      failed_when: false

    - name: Verify Portworx operator is available in Software Catalog
      kubernetes.core.k8s_info:
        api_version: packages.operators.coreos.com/v1
        kind: PackageManifest
        namespace: openshift-marketplace
        name: portworx-certified
      register: portworx_manifest
      failed_when: portworx_manifest.resources | length == 0

    - name: E2E summary
      ansible.builtin.debug:
        msg:
          - "Base environment: READY"
          - "Portworx pre-installed: {{ portworx_ns_e2e.resources | length > 0 }} (expected false)"
          - "Thanos Querier route: {{ 'OK' if thanos_route.resources | length > 0 else 'MISSING' }}"
          - "Portworx operator in catalog: {{ 'OK' if portworx_manifest.resources | length > 0 else 'MISSING' }}"
          - "User workload monitoring: {{ 'pre-configured' if monitoring_cm.resources | length > 0 else 'not yet configured (expected -- student task)' }}"
