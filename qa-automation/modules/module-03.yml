---
- name: Module 03 - Live migration and high availability
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [module03]
  vars_files:
    - ../vars.yml
  vars:
    e2e_module_id: module-03
    e2e_module_file: student-module-03.yml
  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: "{{ e2e_kubeconfig }}"
  environment:
    KUBECONFIG: "{{ e2e_kubeconfig }}"
  tasks:
    - name: Run module 03 and record its result
      ansible.builtin.import_tasks: ../tasks/run-module.yml
      tags: [module03]
