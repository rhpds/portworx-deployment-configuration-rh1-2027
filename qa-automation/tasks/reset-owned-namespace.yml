---
- name: Verify ownership before resetting exercise resources
  ansible.builtin.include_tasks: owned-namespace.yml

- name: Remove only the E2E-owned exercise namespace and wait for cleanup
  kubernetes.core.k8s:
    state: absent
    kind: Namespace
    name: "{{ e2e_owned_namespace }}"
    wait: true
    wait_timeout: 900

- name: Recreate a clean E2E-owned exercise namespace
  ansible.builtin.include_tasks: owned-namespace.yml
