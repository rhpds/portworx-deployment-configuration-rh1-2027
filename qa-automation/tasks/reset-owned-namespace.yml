---
- name: Verify ownership before resetting exercise resources
  ansible.builtin.include_tasks: owned-namespace.yml

- name: Remove only the E2E-owned exercise namespace and wait for cleanup
  kubernetes.core.k8s:
    state: absent
    kind: Namespace
    name: "{{ e2e_owned_namespace }}"
    wait: false

- name: Poll namespace deletion while keeping the streamed run active
  kubernetes.core.k8s_info:
    kind: Namespace
    name: "{{ e2e_owned_namespace }}"
  register: e2e_reset_namespace_status
  retries: "{{ e2e_retries }}"
  delay: "{{ e2e_delay }}"
  until: e2e_reset_namespace_status.resources | length == 0

- name: Recreate a clean E2E-owned exercise namespace
  ansible.builtin.include_tasks: owned-namespace.yml
