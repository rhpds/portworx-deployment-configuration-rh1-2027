---
- name: Create student VM
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', '../templates/student-vm.yml.j2') | from_yaml }}"

- name: Wait for student VM readiness
  ansible.builtin.include_tasks: wait-student-vm.yml
  vars:
    e2e_wait_vm: "{{ e2e_guest_vm }}"

- name: Wait for guest SSH
  ansible.builtin.include_tasks: guest-command.yml
  vars:
    e2e_guest_name: "{{ e2e_guest_vm }}"
    e2e_guest_command: 'true'
