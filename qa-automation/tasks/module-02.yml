---
# pxe-osv-02.adoc: a usable VM, not just a successfully created API object.
- name: Module 02 - Get solved VM
  kubernetes.core.k8s_info:
    api_version: kubevirt.io/v1
    kind: VirtualMachine
    namespace: "{{ e2e_namespace }}"
    name: "{{ e2e_vm }}"
  register: e2e_vm_resource

- name: Module 02 - Require Ready VM with a boot DataVolume
  ansible.builtin.assert:
    that:
      - e2e_vm_resource.resources | length == 1
      - >-
        e2e_vm_resource.resources[0].status.conditions | selectattr('type', 'equalto', 'Ready')
        | selectattr('status', 'equalto', 'True') | list | length > 0
      - e2e_vm_resource.resources[0].spec.dataVolumeTemplates | length > 0

- name: Module 02 - Get running VMI
  kubernetes.core.k8s_info:
    api_version: kubevirt.io/v1
    kind: VirtualMachineInstance
    namespace: "{{ e2e_namespace }}"
    name: "{{ e2e_vm }}"
  register: e2e_vmi

- name: Module 02 - Require Running VMI
  ansible.builtin.assert:
    that:
      - e2e_vmi.resources | length == 1
      - e2e_vmi.resources[0].status.phase == 'Running'

- name: Module 02 - Get VM disk PVCs
  kubernetes.core.k8s_info:
    kind: PersistentVolumeClaim
    namespace: "{{ e2e_namespace }}"
    name: "{{ item.metadata.name }}"
  loop: "{{ e2e_vm_resource.resources[0].spec.dataVolumeTemplates }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  register: e2e_vm_disks

- name: Module 02 - Require Bound Portworx RWX Block disks
  ansible.builtin.assert:
    that:
      - item.resources | length == 1
      - item.resources[0].status.phase == 'Bound'
      - item.resources[0].spec.storageClassName == 'px-rwx-block-kubevirt'
      - "'ReadWriteMany' in item.resources[0].spec.accessModes"
      - item.resources[0].spec.volumeMode == 'Block'
  loop: "{{ e2e_vm_disks.results }}"
  loop_control:
    label: "{{ item.item.metadata.name }}"

- name: Module 02 - Verify guest SSH works
  ansible.builtin.command:
    argv:
      - virtctl
      - ssh
      - "cloud-user@vm/{{ e2e_vm }}"
      - -n
      - "{{ e2e_namespace }}"
      - -i
      - "{{ e2e_ssh_key }}"
      - -t
      - '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15'
      - -c
      - 'true'
  changed_when: false
  register: e2e_guest_ssh
  retries: "{{ e2e_retries }}"
  delay: "{{ e2e_delay }}"
  until: e2e_guest_ssh.rc == 0
  async: 60
  poll: 5

- name: Module 02 - Report validation
  ansible.builtin.debug:
    msg: 'PASS module-02: running VM, RWX Block disk and working guest access'
