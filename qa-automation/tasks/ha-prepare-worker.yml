---
# Called only when normal placement leaves no router-free HA worker.
# Never moves/restarts Showroom or the router carrying this E2E request.
- name: Detect whether this invocation is a streamed runner job
  ansible.builtin.set_fact:
    e2e_ha_streamed: "{{ job_info_dir is defined or e2e_ha_runner_pods | length > 0 }}"
    e2e_ha_runner_log: ''
    e2e_ha_setup_id: "{{ now(utc=true, fmt='%Y%m%dT%H%M%S') }}-{{ 999999999 | random }}"

- name: Require this runner pod to be identifiable before protecting its stream
  ansible.builtin.assert:
    that: e2e_ha_runner_pods | length == 1
    fail_msg: Cannot identify this streamed job's runner pod; refusing ingress changes.
  when: e2e_ha_streamed | bool

- name: Read this runner access log to identify the current request ingress hop
  kubernetes.core.k8s_log:
    namespace: "{{ e2e_ha_runner_pods[0].metadata.namespace }}"
    name: "{{ e2e_ha_runner_pods[0].metadata.name }}"
    container: runner
  register: e2e_ha_access_log
  no_log: true
  when: e2e_ha_streamed | bool

- name: Store access log privately for topology planning
  ansible.builtin.set_fact:
    e2e_ha_runner_log: "{{ e2e_ha_access_log.log }}"
  no_log: true
  when: e2e_ha_streamed | bool

- name: Plan automatic router evacuation without touching the active stream
  ansible.builtin.include_tasks: ha-stream-plan.yml

- name: Read the selected worker before temporary scheduling changes
  kubernetes.core.k8s_info:
    kind: Node
    name: "{{ e2e_ha_prepare_node }}"
  register: e2e_ha_prepare_node_before

- name: Require the same uncordoned worker and no other preparation owner
  ansible.builtin.assert:
    that:
      - e2e_ha_prepare_node_before.resources | length == 1
      - e2e_ha_prepare_node_before.resources[0].metadata.uid == e2e_ha_prepare_uid
      - not (e2e_ha_prepare_node_before.resources[0].spec.unschedulable | default(false) | bool)
      - >-
        (e2e_ha_prepare_node_before.resources[0].metadata.annotations | default({}))
        .get('lab.rhpds.com/e2e-ha-owner', '') == ''

- name: Prepare an HA worker and always restore its scheduling state
  block:
    - name: Temporarily cordon only the selected worker with an ownership marker
      kubernetes.core.k8s:
        state: patched
        api_version: v1
        kind: Node
        name: "{{ e2e_ha_prepare_node }}"
        definition:
          metadata:
            uid: "{{ e2e_ha_prepare_uid }}"
            annotations:
              lab.rhpds.com/e2e-ha-owner: "{{ e2e_ha_setup_id }}"
          spec:
            unschedulable: true

    - name: Evict only the selected router pods through the disruption-budget API
      ansible.builtin.command:
        argv:
          - oc
          - create
          - --raw
          - "/api/v1/namespaces/openshift-ingress/pods/{{ e2e_router_to_evict.metadata.name }}/eviction"
          - -f
          - '-'
          - --request-timeout=15s
        stdin: >-
          {{ {'apiVersion': 'policy/v1', 'kind': 'Eviction',
              'metadata': {'name': e2e_router_to_evict.metadata.name, 'namespace': 'openshift-ingress'},
              'deleteOptions': {'gracePeriodSeconds': 30,
                                'preconditions': {'uid': e2e_router_to_evict.metadata.uid}}} | to_json }}
      loop: >-
        {{ e2e_ha_router_pods | selectattr('spec.nodeName', 'equalto', e2e_ha_prepare_node) | list }}
      loop_control:
        loop_var: e2e_router_to_evict
        label: "{{ e2e_router_to_evict.metadata.name }}"
      register: e2e_ha_eviction
      changed_when: e2e_ha_eviction.rc == 0
      failed_when: e2e_ha_eviction.rc != 0 and '(NotFound)' not in e2e_ha_eviction.stderr
      retries: "{{ e2e_retries }}"
      delay: "{{ e2e_delay }}"
      until: e2e_ha_eviction.rc == 0 or '(NotFound)' in e2e_ha_eviction.stderr

    - name: Wait for router redundancy to recover away from the HA worker
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: openshift-ingress
        label_selectors:
          - ingresscontroller.operator.openshift.io/deployment-ingresscontroller=default
      register: e2e_ha_routers_after
      retries: "{{ e2e_retries }}"
      delay: "{{ e2e_delay }}"
      until:
        - >-
          e2e_ha_routers_after.resources | selectattr('spec.nodeName', 'defined')
          | selectattr('spec.nodeName', 'equalto', e2e_ha_prepare_node) | list | length == 0
        - >-
          e2e_ha_routers_after.resources | selectattr('status.conditions', 'defined')
          | map(attribute='status.conditions') | map('selectattr', 'type', 'equalto', 'Ready')
          | map('selectattr', 'status', 'equalto', 'True') | map('list') | reject('equalto', [])
          | list | length >= e2e_ha_ready_routers | length
  always:
    - name: Read preparation ownership before restoring worker scheduling
      kubernetes.core.k8s_info:
        kind: Node
        name: "{{ e2e_ha_prepare_node }}"
      register: e2e_ha_node_cleanup
      retries: 5
      delay: 3
      until: e2e_ha_node_cleanup is not failed

    - name: Uncordon only this run's worker and remove its temporary ownership marker
      kubernetes.core.k8s:
        state: patched
        api_version: v1
        kind: Node
        name: "{{ e2e_ha_prepare_node }}"
        definition:
          metadata:
            uid: "{{ e2e_ha_prepare_uid }}"
            annotations:
              lab.rhpds.com/e2e-ha-owner: null
          spec:
            unschedulable: false
      when:
        - e2e_ha_node_cleanup.resources | length == 1
        - e2e_ha_node_cleanup.resources[0].metadata.uid == e2e_ha_prepare_uid
        - >-
          (e2e_ha_node_cleanup.resources[0].metadata.annotations | default({}))
          .get('lab.rhpds.com/e2e-ha-owner', '') == e2e_ha_setup_id
      retries: 5
      delay: 3
      register: e2e_ha_uncordon
      until: e2e_ha_uncordon is not failed

- name: Refresh actual node readiness and scheduling state after preparation
  ansible.builtin.include_tasks: pxctl-target.yml

- name: Refresh pod topology after automatic HA preparation
  kubernetes.core.k8s_info:
    kind: Pod
  register: e2e_cluster_pods

- name: Replan using actual router placement after preparation
  ansible.builtin.include_tasks: ha-node-plan.yml

- name: Require the prepared worker to be free of both Showroom and ingress
  ansible.builtin.assert:
    that:
      - e2e_ha_prepare_node in e2e_migration_candidates
      - >-
        (e2e_nodes.resources | selectattr('metadata.name', 'equalto', e2e_ha_prepare_node)
         | first).metadata.uid == e2e_ha_prepare_uid
      - >-
        ((e2e_nodes.resources | selectattr('metadata.name', 'equalto', e2e_ha_prepare_node)
          | first).metadata.annotations | default({})).get('lab.rhpds.com/e2e-ha-owner', '') == ''
    fail_msg: Node ownership or router placement changed during preparation; refusing an unsafe worker reboot.
