project:
  slug: "portworx-deployment-configuration-rh1-2027"
  owner_email: "rgarciac@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "rh1_2027"
  showroom_type: "classic"
  intake_type: "migration"
  automation_type: "ansible"
  description: " Migration of the existing Portworx Enterprise lab (pxe-rhdp-lab) into the Publishing House workflow for Red Hat One 2027. This lab covers Portworx Enterprise deployment and configuration on   OpenShift as a vSAN/datastore replacement for OCP Virtualization environments. Scope: Kube Datastore overview (KDS vs PXE), installing Portworx Enterprise via the OCP Operator catalog,   managing storage and dynamic storage pools, deploying VM workloads on RWX block storage, simulating node failover and storage recovery, manual pool relocation, and auto-rebalancing across   heterogeneous backends. Target audience: Red Hat field (SEs, architects, sellers). Duration: approximately 2 hours."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-2096"
  workflow_id: "48b2a09d-edb0-4a55-b1d9-2f6a3ef98148"

spec:
  title: "Portworx Enterprise Deployment and Configuration on OpenShift"
  learning_objectives:
    - "Install Portworx Enterprise on OpenShift by generating a spec in Portworx Central, deploying the Portworx Operator from the OpenShift Software Catalog, and creating a StorageCluster custom resource"
    - "Configure dynamic storage pools and OpenShift StorageClasses backed by Portworx distributed volumes, verifying pool health with pxctl"
    - "Deploy VM workloads on RWX block storage, enable the Portworx console plugin, and observe enterprise data services as a native tab in the OpenShift console"
    - "Execute a storage-level failover, verify workload continuity after a simulated node failure, and analyze per-VM storage telemetry"
    - "Perform a manual pool relocate operation and verify data integrity across storage tiers"
  modules:
    - id: module-01
      title: "Overview of Kube Datastore"
      duration_min: 15
      status: not_started
    - id: module-02
      title: "Installing Portworx Enterprise on OpenShift"
      duration_min: 35
      status: not_started
    - id: module-03
      title: "Storage and Dynamic Storage Pools"
      duration_min: 20
      status: not_started
    - id: module-04
      title: "Deploying Demo Workloads"
      duration_min: 20
      status: not_started
    - id: module-05
      title: "Failover Exercise"
      duration_min: 20
      status: not_started
    - id: module-06
      title: "Manual Pool Relocate"
      duration_min: 15
      status: not_started
    - id: module-07
      title: "Discussion: Auto-Rebalancing and Multiple Back-ends"
      duration_min: 15
      status: not_started
  environment:
    platform: "ocp"            # ocp | rhel-vms — determines which sizing fields apply
    topology: "per-student"    # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv        # cnv | aws — cnv is default
    max_concurrent_users: null # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: ""                    # e.g. 4.20 — minimum 4.20; leave empty for rhel-vms
    cluster_type: ""                   # sno | multinode — only for platform = ocp
    control_plane_instance_count: null # 1 if sno, 3 if multinode
    control_plane_cpu: null            # 32 if sno, 16 if multinode
    control_plane_ram_gb: null         # 128 if sno, 64 if multinode
    worker_count: null                 # number of OCP worker nodes
    worker_cpu: null                   # vCPU per worker
    worker_ram_gb: null                # RAM per worker in GB
    worker_disk_gb: null               # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: ""                    # required if AAP in products
    ai_requirement: ""                 # maas | gpu | none
    ai_model_tier: ""                  # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: ""                  # specific model e.g. granite-3.1-8b
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products: []                # list of non-GA products/versions
    non_ga_access_plan: ""             # how access is provided for non-GA products
    external_services: []              # named external service dependencies e.g. [github.com]
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: 2.5
  audience: "intermediate"   # beginner | intermediate | advanced

